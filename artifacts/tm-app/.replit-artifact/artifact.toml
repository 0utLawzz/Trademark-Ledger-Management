kind = "web"
previewPath = "/"
title = "Trademark Ledger & Case Management"
version = "1.0.0"
id = "artifacts/tm-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25680

[services.development]
run = "pnpm --filter @workspace/tm-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tm-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/tm-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25680"
BASE_PATH = "/"
